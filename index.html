<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Admin Dashboard</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <ul>
                <a href="#dashboard">
                    <li><img class="sidebar-icon" src="./icons/dashboard.svg" alt="dashboard-icon" height="50px">Dashboard</li>
                </a>
            </ul>
            <ul>
                <a href="#home">
                    <li><img class="sidebar-icon" src="./icons/account.svg" alt="account-icon" height="30px">Home</li>
                </a>
                <a href="#profile">
                    <li><img class="sidebar-icon" src="./icons/card-account.svg" alt="profile-account" height="30px">Profile</li>
                </a>
                <a href="#messages">
                    <li><img class="sidebar-icon" src="./icons/message.svg" alt="messages-account" height="30px">Messages</li>
                </a>
                <a href="#history">
                    <li><img class="sidebar-icon" src="./icons/clock.svg" alt="history-icon" height="30px">History</li>
                </a>
                <a href="#tasks">
                    <li><img class="sidebar-icon" src="./icons/task-multiple.svg" alt="tasks-icon" height="30px">Tasks</li>
                </a>
                <a href="#communities">
                    <li><img class="sidebar-icon" src="./icons/communities.svg" alt="communities-icon" height="30px">Communities</li>
                </a>
            </ul>
            <ul>
                <a href="#settings">
                    <li><img class="sidebar-icon" src="./icons/settings.svg" alt="settings-icon" height="30px">Settings</li>
                </a>
                <a href="#support">
                    <li><img class="sidebar-icon" src="./icons/support.svg" alt="support-icon" height="30px">Support</li>
                </a>
                <a href="#privacy">
                    <li><img class="sidebar-icon" src="./icons/privacy.svg" alt="privacy-icon" height="30px">Privacy</li>
                </a>
            </ul>
        </div>
        <div class="header">
            <div class="header-top">
                <form id="search-bar">
                    <input type="text" id="user-search">
                </form>
            </div>
        </div>
        <div class="main-content">
            <div class="cards">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="cards-plus">
                <div class="annons"></div>
                <div class="trending"></div>
            </div>
        </div>
    </div>
</body>
</html>
